<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Analyze Zylinderfolgeschach positions with Kugelfisch." />
    <meta name="theme-color" content="#171614" />
    <title>Analysis · Kugelfisch</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-page="analysis">
    <header class="site-header"><div class="site-shell header-inner"><a class="brand" href="/"><img class="brand-mark" src="/mark.svg" alt="" />Kugelfisch</a><nav class="site-nav" aria-label="Primary navigation"><a href="/play">Play</a><a href="/games">Games</a><a href="/analysis" aria-current="page">Analysis</a></nav></div></header>
    <main class="site-shell page-main" id="main">
      <div class="page-heading workspace-heading"><h1>Analysis</h1><span class="page-context">Kugelfisch</span></div>
      <p id="analysis-source" class="message" hidden></p>
      <div class="analysis-layout">
        <div class="analysis-board-column">
          <section class="position-card board-status" id="analysis-position-card"><div class="status-line"><span id="analysis-turn-dot" class="turn-dot"></span><div><strong id="analysis-status">Loading…</strong><span id="analysis-status-detail"></span></div></div></section>
          <div class="board-frame"><span class="seam seam-left" aria-hidden="true">↔</span><div id="analysis-board" class="board" role="application" aria-label="Analysis board"></div><span class="seam seam-right" aria-hidden="true">↔</span></div>
          <div class="board-toolbar"><div class="replay-controls"><button id="analysis-start" type="button" aria-label="Go to start" title="Go to start">⇤</button><button id="analysis-back" type="button" aria-label="Previous move" title="Previous move (←)">‹</button><button id="analysis-forward" type="button" aria-label="Next move" title="Next move (→)">›</button><button id="analysis-end" type="button" aria-label="Go to last move" title="Go to last move">⇥</button></div><button id="analysis-flip" class="quiet-button" type="button">Flip board</button></div>
        </div>
        <aside class="analysis-console">
          <section class="panel engine-panel">
            <div class="panel-heading"><h2>Evaluation</h2><label class="engine-switch"><input id="analysis-toggle" type="checkbox" checked disabled /><span class="switch-track" aria-hidden="true"><span></span></span><span>Engine</span></label></div>
            <div class="evaluation-summary"><div class="evaluation-value"><span id="analysis-score">—</span><span class="score-perspective">White's perspective</span></div><div class="analysis-controls"><select id="analysis-depth" aria-label="Analysis depth"><option value="8">Depth 8</option><option value="9" selected>Depth 9</option><option value="10">Depth 10</option><option value="12">Depth 12</option><option value="14">Depth 14</option></select></div></div>
            <div class="engine-metrics"><strong id="analysis-engine-status">Ready</strong><span id="analysis-depth-readout">Depth —</span><span id="analysis-nodes">— nodes</span></div>
            <p id="analysis-pv" class="engine-pv" aria-label="Engine principal variation">No line.</p>
          </section>
          <section class="panel move-section"><div class="panel-heading"><h2>Moves</h2><span id="analysis-ply-count" class="count">0 / 0</span></div><div class="history-heading" aria-hidden="true"><span>#</span><span>White</span><span>Black</span></div><div id="analysis-history" class="history empty">No moves yet</div></section>
          <details class="panel position-tools"><summary>Position tools</summary><div class="field"><label for="analysis-fen">ZFS-FEN</label><textarea id="analysis-fen" rows="3" spellcheck="false"></textarea></div><div class="compact-actions"><button id="analysis-load" class="primary" type="button">Load position</button><button id="analysis-copy" type="button">Copy</button></div><button id="analysis-reset" class="quiet-button full-button" type="button">Reset to starting position</button></details>
          <p id="analysis-error" class="message error" role="alert"></p>
        </aside>
      </div>
    </main>
    <footer class="site-footer"><div class="site-shell footer-inner"><span>Kugelfisch</span><div><a href="/play">Play</a><a href="/games">Games</a></div></div></footer>
    <dialog id="analysis-promotion-dialog"><div class="dialog-body"><h2>Promotion</h2><div id="analysis-promotion-choices" class="promotion-grid"></div><button id="analysis-cancel-promotion" type="button">Cancel</button></div></dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
