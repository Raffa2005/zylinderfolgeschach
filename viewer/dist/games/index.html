<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Saved Kugelfisch games." />
    <meta name="theme-color" content="#171614" />
    <title>Games · Kugelfisch</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-page="games">
    <header class="site-header"><div class="site-shell header-inner"><a class="brand" href="/"><img class="brand-mark" src="/mark.svg" alt="" />Kugelfisch</a><nav class="site-nav" aria-label="Primary navigation"><a href="/play">Play</a><a href="/games" aria-current="page">Games</a><a href="/analysis">Analysis</a></nav></div></header>
    <main class="site-shell page-main" id="main">
      <section id="archive-view">
        <div class="page-heading"><h1>Games</h1><a class="button primary" href="/play">New game</a></div>
        <p id="archive-loading" class="message">Loading games…</p>
        <div id="archive-grid" class="archive-grid" hidden></div>
        <div id="archive-empty" class="empty-state" hidden><p>No saved games.</p><a class="button primary" href="/play">Play</a></div>
        <p id="archive-error" class="message error" role="alert"></p>
        <div id="archive-pager" class="pager" hidden><button id="load-more" type="button">Load more</button></div>
      </section>
      <section id="detail-view" hidden>
        <div class="page-heading"><h1 id="detail-heading">Game</h1><div class="heading-actions"><a id="analyze-game" class="button primary" href="/analysis">Analyze</a><a class="button" href="/games">All games</a></div></div>
        <p id="detail-loading" class="message">Loading game…</p>
        <div id="detail-content" class="detail-layout" hidden>
          <div class="panel replay-panel">
            <div class="board-frame"><span class="seam seam-left" aria-hidden="true">↔</span><div id="replay-board" class="board" role="application" aria-label="Saved game replay"></div><span class="seam seam-right" aria-hidden="true">↔</span></div>
            <div class="replay-controls wide"><button id="replay-start" type="button">⇤</button><button id="replay-back" type="button">←</button><span id="replay-counter">0 / 0</span><button id="replay-forward" type="button">→</button><button id="replay-end" type="button">⇥</button></div>
          </div>
          <aside class="side-stack">
            <section class="panel"><strong id="detail-result" class="detail-result"></strong><div id="detail-players" class="detail-players"></div><div id="detail-meta" class="meta-list"></div></section>
            <section class="panel move-section"><div class="panel-heading"><h2>Moves</h2><span id="detail-ply-count" class="count"></span></div><div id="detail-moves" class="history"></div></section>
          </aside>
        </div>
        <p id="detail-error" class="message error" role="alert"></p>
      </section>
    </main>
    <footer class="site-footer"><div class="site-shell footer-inner"><span>Saved locally</span><div><a href="/play">Play</a><a href="/analysis">Analysis</a></div></div></footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
