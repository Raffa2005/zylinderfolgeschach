<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play Zylinderfolgeschach against Kugelfisch." />
    <meta name="theme-color" content="#171614" />
    <title>Play · Kugelfisch</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-page="play">
    <header class="site-header">
      <div class="site-shell header-inner">
        <a class="brand" href="/"><img class="brand-mark" src="/mark.svg" alt="" />Kugelfisch</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/play" aria-current="page">Play</a><a href="/games">Games</a><a href="/analysis">Analysis</a>
        </nav>
      </div>
    </header>
    <main id="main">
      <section class="site-shell page-main" id="setup-view">
        <div class="setup-layout">
          <div class="setup-copy"><img class="setup-mark" src="/mark.svg" alt="" /><p class="eyebrow">Zylinderfolgeschach-Engine</p><h1>New game</h1><p class="setup-subtitle">You and Kugelfisch.</p></div>
          <form class="panel setup-card" id="setup-form">
            <div class="panel-heading"><h2>Your game</h2><span class="count">No clock</span></div>
            <fieldset>
              <legend>Side</legend>
              <div class="choice-grid">
                <div class="choice"><input id="color-white" type="radio" name="color" value="white" /><label for="color-white"><span class="side-token white" aria-hidden="true"></span>White</label></div>
                <div class="choice"><input id="color-random" type="radio" name="color" value="random" checked /><label for="color-random"><span class="side-token random" aria-hidden="true"></span>Random</label></div>
                <div class="choice"><input id="color-black" type="radio" name="color" value="black" /><label for="color-black"><span class="side-token black" aria-hidden="true"></span>Black</label></div>
              </div>
            </fieldset>
            <div class="field">
              <label for="engine-depth">Strength</label>
              <select id="engine-depth"><option value="8">Depth 8</option><option value="9" selected>Depth 9</option><option value="10">Depth 10</option><option value="12">Depth 12</option></select>
            </div>
            <button id="start-game" class="primary full-button" type="submit" disabled>Start game</button>
            <p id="setup-message" class="message" role="status">Loading engine.</p>
          </form>
        </div>
      </section>
      <section class="game-page" id="game-view" hidden>
        <div class="game-layout">
          <div class="game-column">
            <section class="position-card board-status" id="position-card" aria-live="polite">
              <div class="status-line"><span id="turn-dot" class="turn-dot"></span><div><strong id="status">Loading…</strong><span id="status-detail"></span></div></div>
              <p id="engine-status" class="engine-status">Ready</p>
            </section>
            <div class="player-strip"><div><strong id="top-player">Kugelfisch</strong><span id="top-player-meta"></span></div><span id="top-player-state" class="side-state"></span></div>
            <div class="board-frame"><span class="seam seam-left" aria-hidden="true">↔</span><div id="board" class="board" role="application" aria-label="Zylinderfolgeschach board"></div><span class="seam seam-right" aria-hidden="true">↔</span></div>
            <div class="player-strip"><div><strong id="bottom-player">You</strong><span id="bottom-player-meta"></span></div><span id="bottom-player-state" class="side-state"></span></div>
            <div class="board-toolbar"><div class="replay-controls"><button id="start-position" type="button" aria-label="Go to start" title="Go to start">⇤</button><button id="back" type="button" aria-label="Previous move" title="Previous move (←)">‹</button><button id="forward" type="button" aria-label="Next move" title="Next move (→)">›</button><button id="live-position" type="button" aria-label="Go to live position" title="Go to live position">⇥</button></div><button id="flip" class="quiet-button" type="button">Flip board</button></div>
          </div>
          <aside class="game-console">
            <section class="panel move-section">
              <div class="panel-heading"><h2>Moves</h2><span id="ply-count" class="count">0 / 0</span></div>
              <div class="history-heading" aria-hidden="true"><span>#</span><span>White</span><span>Black</span></div>
              <div id="history" class="history empty">No moves yet</div>
            </section>
            <a id="review-game" class="button primary" href="/games" hidden>Review game <span aria-hidden="true">↗</span></a>
            <div class="game-actions"><button id="new-game" type="button">New game</button><button id="resign" class="danger" type="button">Resign</button></div>
            <p id="error" class="message error" role="alert"></p>
          </aside>
        </div>
      </section>
    </main>
    <footer class="site-footer"><div class="site-shell footer-inner"><span>Kugelfisch</span><div><a href="/games">Games</a><a href="/analysis">Analysis</a></div></div></footer>
    <dialog id="promotion-dialog"><div class="dialog-body"><h2>Promotion</h2><div id="promotion-choices" class="promotion-grid"></div><button id="cancel-promotion" type="button">Cancel</button></div></dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
